# Обновления зависимостей. Запросы на слияние идут в dev: main обновляется
# только выпуском, а проверки ci.yml работают на push в dev.
version: 2
updates:
  # Зависимости Rust: один общий Cargo.lock рабочего пространства.
  - package-ecosystem: cargo
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Мелкие обновления одним запросом: отдельный PR на каждый патч-релиз
      # съедает больше внимания, чем экономит.
      rust-minor-and-patch:
        update-types:
          - minor
          - patch

  # Действия в рабочих процессах сборки.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        update-types:
          - minor
          - patch
