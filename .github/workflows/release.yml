name: Release

# Только main. Релиз публикуется, когда версия в Cargo.toml выросла - для
# существующего тега сборка пропускается. Схема: meta создаёт черновик релиза,
# три платформы параллельно собирают и заливают ассеты, manifest собирает
# updater latest.json и публикует релиз.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Ключ подписи пакетов обновления (tauri-plugin-updater).
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  # OAuth client id/secret вшиваются в бинарник на компиляции (option_env! в
  # crates/core). Без них релизная сборка не может обновлять OAuth-токены и
  # пользователь видит "токен не настроен".
  TRUEMAIL_GOOGLE_CLIENT_ID: ${{ secrets.TRUEMAIL_GOOGLE_CLIENT_ID }}
  TRUEMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.TRUEMAIL_GOOGLE_CLIENT_SECRET }}
  TRUEMAIL_YANDEX_CLIENT_ID: ${{ secrets.TRUEMAIL_YANDEX_CLIENT_ID }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - name: Версия из Cargo.toml
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Версия: $version"
      - name: Нужен ли релиз
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft -q .isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
              # Остатки прерванного прогона: пересоздаём черновик начисто.
              gh release delete "$TAG" --yes
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "Релиз $TAG уже опубликован - сборка пропускается"
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Черновик релиза
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "truemail $TAG" --notes-file docs/RELEASE_NOTES.md

  linux:
    needs: meta
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      OPENSSL_NO_VENDOR: 1
      # Страховка для окружений без FUSE: linuxdeploy распаковывается
      # вместо монтирования.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            rpm patchelf
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Установить tauri-cli
        # Версия зафиксирована: NSIS-шаблон вендорен с этого тега
        # (apps/desktop/src-tauri/nsis/installer.nsi). При обновлении версии
        # перевендорить шаблон.
        # --force: rust-cache восстанавливает метаданные binstall, но не
        # ~/.cargo/bin - без --force binstall считает cli установленным.
        run: cargo binstall tauri-cli --version 2.11.4 --locked --no-confirm --force
      - name: Сборка пакетов
        run: |
          cd apps/desktop/src-tauri
          cargo tauri build --bundles deb,rpm,appimage
      - name: Залить ассеты
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          find target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.AppImage.sig' \) \
            -exec gh release upload "$TAG" {} --clobber \;

  windows:
    needs: meta
    if: needs.meta.outputs.publish == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Установить tauri-cli
        # Версия зафиксирована: NSIS-шаблон вендорен с этого тега
        # (apps/desktop/src-tauri/nsis/installer.nsi). При обновлении версии
        # перевендорить шаблон.
        # --force: rust-cache восстанавливает метаданные binstall, но не
        # ~/.cargo/bin - без --force binstall считает cli установленным.
        run: cargo binstall tauri-cli --version 2.11.4 --locked --no-confirm --force
      - name: Сборка NSIS
        run: |
          .\scripts\dev.ps1 -Check
          Push-Location apps\desktop\src-tauri
          try { cargo tauri build --bundles nsis } finally { Pop-Location }
      - name: Залить ассеты
        # GitHub принимает .exe ассетом напрямую: zip-обёртка не нужна,
        # updater ставит NSIS-инсталлятор по его же .sig.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          $files = Get-ChildItem target\release\bundle\nsis -File |
            Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.exe.sig' }
          if (-not ($files | Where-Object { $_.Name -like '*.exe' })) { throw 'NSIS installer not found' }
          if (-not ($files | Where-Object { $_.Name -like '*.exe.sig' })) { throw 'NSIS signature not found' }
          foreach ($f in $files) { gh release upload $env:TAG $f.FullName --clobber }

  macos:
    # Универсальная сборка (arm64 + x86_64 в одном бинарнике): один .dmg для
    # установки и один .app.tar.gz для updater подходят на обеих архитектурах
    # Apple (specs/macos-universal-release.md, issue #65).
    needs: meta
    if: needs.meta.outputs.publish == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Установить tauri-cli
        # Версия зафиксирована: NSIS-шаблон вендорен с этого тега
        # (apps/desktop/src-tauri/nsis/installer.nsi). При обновлении версии
        # перевендорить шаблон.
        # --force: rust-cache восстанавливает метаданные binstall, но не
        # ~/.cargo/bin - без --force binstall считает cli установленным.
        run: cargo binstall tauri-cli --version 2.11.4 --locked --no-confirm --force
      - name: Цели Rust для универсальной сборки
        # S-001: обе цели ставятся заранее, а не полагаемся на неявную
        # установку внутри cargo tauri build - ошибка любой из них должна
        # остановить задание до сборки.
        run: |
          set -e
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            if ! rustup target list --installed | grep -qx "$t"; then
              echo "цель Rust не установлена: $t" >&2
              exit 1
            fi
          done
      - name: Сборка универсального пакета
        # S-002: один вызов cargo tauri build с целью universal-apple-darwin
        # вместо нативной сборки под архитектуру раннера.
        run: |
          cd apps/desktop/src-tauri
          cargo tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Проверить архитектуры универсального пакета
        # S-003: подтверждаем средствами macOS (lipo), что arm64 и x86_64
        # присутствуют не только в основном бинарнике, но и во всех прочих
        # исполняемых файлах и библиотеках внутри .app - иначе универсальный
        # пакет мог бы оказаться собран лишь наполовину.
        # F8: lipo вызывается только для файлов, которые `file` определяет как
        # Mach-O - обычный ресурс или Info.plist внутри Contents/Frameworks
        # (не Mach-O) иначе завалил бы весь выпуск, хотя к архитектурам
        # никакого отношения не имеет. Отдельно проверяем, что основной
        # исполняемый файл приложения найден и действительно прошёл проверку
        # архитектур, а не был случайно пропущен вместе с посторонними файлами.
        run: |
          set -e
          bundle_dir="target/universal-apple-darwin/release/bundle"
          app_count=$(find "$bundle_dir/macos" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')
          if [ "$app_count" -ne 1 ]; then
            echo "ожидался ровно один каталог .app, найдено: $app_count" >&2
            exit 1
          fi
          app_path=$(find "$bundle_dir/macos" -maxdepth 1 -type d -name '*.app')
          executable_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")
          main_executable="$app_path/Contents/MacOS/$executable_name"
          if [ ! -f "$main_executable" ]; then
            echo "не найден основной исполняемый файл: $main_executable" >&2
            exit 1
          fi
          checked_count=0
          main_checked=0
          check_arch() {
            local f="$1"
            case "$(file -b "$f")" in
              Mach-O*) ;;
              *) return 0 ;;
            esac
            local archs
            archs=$(lipo -archs "$f" 2>/dev/null || true)
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) echo "ок: $f -> $archs" ;;
              *) echo "нет обеих архитектур (arm64, x86_64) в $f (найдено: $archs)" >&2; exit 1 ;;
            esac
            checked_count=$((checked_count + 1))
            if [ "$f" = "$main_executable" ]; then
              main_checked=1
            fi
          }
          while IFS= read -r -d '' f; do check_arch "$f"; done < <(find "$app_path/Contents/MacOS" -type f -print0)
          if [ -d "$app_path/Contents/Frameworks" ]; then
            while IFS= read -r -d '' f; do check_arch "$f"; done < <(find "$app_path/Contents/Frameworks" -type f -print0)
          fi
          if [ "$main_checked" -ne 1 ]; then
            echo "основной исполняемый файл не был проверен: $main_executable" >&2
            exit 1
          fi
          echo "проверено файлов Mach-O: $checked_count (основной исполняемый файл: $main_executable)"
      - name: Залить ассеты
        # S-004/S-006: источник - только каталог universal-apple-darwin;
        # ровно один .dmg и ровно один архив .app.tar.gz с подписью, иначе
        # ошибка (выбор по порядку обхода каталога запрещён спецификацией).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -e
          bundle_dir="target/universal-apple-darwin/release/bundle"
          dmg_count=$(find "$bundle_dir" -type f -name '*.dmg' | wc -l | tr -d ' ')
          if [ "$dmg_count" -ne 1 ]; then
            echo "ожидался ровно один .dmg в $bundle_dir, найдено: $dmg_count" >&2
            exit 1
          fi
          archive_count=$(find "$bundle_dir" -type f -name '*.app.tar.gz' | wc -l | tr -d ' ')
          if [ "$archive_count" -ne 1 ]; then
            echo "ожидался ровно один .app.tar.gz в $bundle_dir, найдено: $archive_count" >&2
            exit 1
          fi
          dmg=$(find "$bundle_dir" -type f -name '*.dmg')
          archive=$(find "$bundle_dir" -type f -name '*.app.tar.gz')
          sig="$archive.sig"
          if [ ! -f "$sig" ]; then
            echo "не найдена подпись архива обновления: $sig" >&2
            exit 1
          fi
          echo "dmg: $dmg"
          echo "archive: $archive"
          echo "signature: $sig"
          gh release upload "$TAG" "$dmg" "$archive" "$sig" --clobber

  manifest:
    # Собирает updater latest.json из ассетов всех платформ, заливает его
    # ассетом релиза и публикует черновик. Endpoint приложения:
    # releases/latest/download/latest.json - стабильный URL последнего релиза.
    needs: [meta, linux, windows, macos]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Собрать latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --json assets -q '.assets[].name' > assets.txt
          mkdir -p sigs
          gh release download "$TAG" --pattern '*.sig' --dir sigs
          python3 - <<'PY'
          import datetime, json, os, pathlib
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          assets = pathlib.Path("assets.txt").read_text().split()
          sigs = {p.name: p.read_text().strip() for p in pathlib.Path("sigs").iterdir()}
          url = lambda name: f"https://github.com/{repo}/releases/download/{tag}/{name}"
          specs = [
              ("windows-x86_64", ".exe"),
              ("linux-x86_64", ".AppImage"),
              ("darwin-aarch64", ".app.tar.gz"),
          ]
          platforms = {}
          for key, suffix in specs:
              # S-006: ровно один подходящий файл, иначе манифест не должен
              # выбирать файл по порядку обхода assets.txt.
              matches = [a for a in assets if a.endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit(
                      f"ожидался ровно один файл для {key} ({suffix}), найдено: {len(matches)}"
                  )
              pkg = matches[0]
              if pkg + ".sig" not in sigs:
                  raise SystemExit(f"нет подписи для {pkg}")
              platforms[key] = {"signature": sigs[pkg + ".sig"], "url": url(pkg)}
          # S-005: универсальный пакет macOS один на обе архитектуры - записи
          # darwin-aarch64 и darwin-x86_64 ссылаются на один и тот же архив
          # и одну и ту же подпись.
          platforms["darwin-x86_64"] = dict(platforms["darwin-aarch64"])
          required_keys = {k for k, _ in specs} | {"darwin-x86_64"}
          missing = required_keys - set(platforms)
          if missing:
              raise SystemExit(f"нет платформ для манифеста: {sorted(missing)}")
          # S-008: полнота манифеста - обязательные ключи и непустые поля.
          for key in sorted(required_keys):
              entry = platforms[key]
              if not entry.get("url") or not entry.get("signature"):
                  raise SystemExit(f"пустое поле url или signature у платформы {key}")
          manifest = {
              "version": tag.lstrip("v"),
              "notes": f"truemail update {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          pathlib.Path("latest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          gh release upload "$TAG" latest.json --clobber
          gh release edit "$TAG" --draft=false --latest
